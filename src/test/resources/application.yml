spring:
  application:
    name: base-gateway-admin
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gateway_admin;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

opensabre:
  gateway-admin:
    nacos:
      server-url: http://localhost:8848
    prometheus:
      server-url: http://localhost:9090

jasypt:
  encryptor:
    password: gateway-admin-test

# 上下文测试使用 JetCache 自带内存远程缓存，避免依赖外部 Redis。
jetcache:
  remote:
    default:
      type: mock
    longTime:
      type: mock
    shortTime:
      type: mock
