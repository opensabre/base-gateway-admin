spring:
  application:
    name: base-gateway-admin
  security:
    oauth2:
      client:
        registration:
          actuator-read:
            provider: opensabre
            client-id: test-actuator
            client-secret: test-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: actuator.read
        provider:
          opensabre:
            token-uri: http://localhost:8000/oauth2/token
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gateway_admin;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

opensabre:
  gateway-admin:
    nacos:
      server-url: http://localhost:8848
  monitoring:
    collector:
      enabled: true
    prometheus:
      server-url: http://localhost:9090

jasypt:
  encryptor:
    password: gateway-admin-test

# 上下文测试使用 JetCache 自带内存远程缓存，避免依赖外部 Redis。
jetcache:
  remote:
    default:
      type: mock
    longTime:
      type: mock
    shortTime:
      type: mock
