spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:${DATASOURCE_DBTYPE:mysql}://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:3306}/os_base_gateway_admin?characterEncoding=UTF-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:root123}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20

opensabre:
  gateway-admin:
    # 迁移完成后由本服务唯一写入网关配置；紧急情况下可显式设为 false 停写。
    configuration-write-enabled: ${GATEWAY_CONFIGURATION_WRITE_ENABLED:true}
    nacos:
      server-url: ${NACOS_SERVER_URL:http://${REGISTER_HOST:localhost}:${REGISTER_PORT:8848}}
      group: ${GATEWAY_CONFIG_GROUP:DEFAULT_GROUP}
      gateway-data-id: ${GATEWAY_CONFIG_DATA_ID:base-gateway.yml}
    prometheus:
      server-url: ${PROMETHEUS_URL:http://localhost:9090}
  rest:
    swagger:
      version: v0.0.1
      title: OpenSabre Gateway Admin API
      description: OpenSabre gateway control plane API
      licenseUrl: https://github.com/opensabre/base-gateway-admin
      licenseName: Apache 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,internalTokenKeyStatus

logging:
  level:
    io.github.opensabre.gateway.admin: debug

mybatis-plus:
  global-config:
    db-config:
      table-prefix: base_gateway_admin_
